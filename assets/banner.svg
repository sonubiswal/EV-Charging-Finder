<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-label="EV Charging Finder banner" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#04130f"/>
      <stop offset="0.55" stop-color="#0a2e27"/>
      <stop offset="1" stop-color="#0f6b4f"/>
    </linearGradient>
    <linearGradient id="title" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#7dffc4"/>
    </linearGradient>
    <linearGradient id="bolt" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e9ff8a"/>
      <stop offset="1" stop-color="#37e08f"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#37e08f" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#37e08f" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#ffffff" stroke-opacity="0.05" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1200" height="320" rx="22" fill="url(#bg)"/>
  <rect width="1200" height="320" rx="22" fill="url(#grid)"/>

  <!-- route -->
  <path id="route" d="M700 270 C 780 270, 790 190, 870 190 S 960 110, 1040 110" fill="none" stroke="#ffffff" stroke-opacity="0.18" stroke-width="10" stroke-linecap="round"/>
  <path d="M700 270 C 780 270, 790 190, 870 190 S 960 110, 1040 110" fill="none" stroke="#37e08f" stroke-width="5" stroke-linecap="round" stroke-dasharray="4 16">
    <animate attributeName="stroke-dashoffset" from="0" to="-200" dur="5s" repeatCount="indefinite"/>
  </path>

  <!-- start dot -->
  <circle cx="700" cy="270" r="11" fill="#ffffff"/>
  <circle cx="700" cy="270" r="22" fill="none" stroke="#ffffff" stroke-opacity="0.5">
    <animate attributeName="r" values="12;30" dur="2.4s" repeatCount="indefinite"/>
    <animate attributeName="stroke-opacity" values="0.6;0" dur="2.4s" repeatCount="indefinite"/>
  </circle>

  <!-- station pin with bolt -->
  <circle cx="1040" cy="95" r="90" fill="url(#glow)"/>
  <path d="M1040 170 C 1000 125, 990 108, 990 90 A50 50 0 1 1 1090 90 C 1090 108, 1080 125, 1040 170 Z" fill="#0b3d31" stroke="#37e08f" stroke-width="4"/>
  <circle cx="1040" cy="90" r="34" fill="#0a2e27" stroke="#37e08f" stroke-opacity="0.6" stroke-width="2"/>
  <path d="M1048 66 L1026 96 H1040 L1034 116 L1058 84 H1043 Z" fill="url(#bolt)">
    <animate attributeName="opacity" values="1;0.65;1" dur="1.8s" repeatCount="indefinite"/>
  </path>

  <!-- title -->
  <text x="70" y="140" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="68" font-weight="800" fill="url(#title)" letter-spacing="1">EV Charging Finder</text>
  <text x="72" y="188" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="25" fill="#b6f5d8">Find the nearest charger in India  •  Route drawn on an interactive map</text>

  <!-- chips -->
  <g font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="600" fill="#ffffff">
    <rect x="72" y="226" width="96" height="34" rx="17" fill="#ffffff" fill-opacity="0.14"/>
    <text x="120" y="248" text-anchor="middle">Folium</text>
    <rect x="180" y="226" width="150" height="34" rx="17" fill="#ffffff" fill-opacity="0.14"/>
    <text x="255" y="248" text-anchor="middle">OpenStreetMap</text>
    <rect x="342" y="226" width="84" height="34" rx="17" fill="#ffffff" fill-opacity="0.14"/>
    <text x="384" y="248" text-anchor="middle">OSRM</text>
    <rect x="438" y="226" width="110" height="34" rx="17" fill="#ffffff" fill-opacity="0.14"/>
    <text x="493" y="248" text-anchor="middle">Python 3.10+</text>
  </g>
</svg>
